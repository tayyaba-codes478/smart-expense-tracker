<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Header -->
        <header>
            <div>
                <h1>Expense Tracker</h1>
                <p>Manage your money smartly.</p>
            </div>

            <div class="header-icon">💜</div>
        </header>

        <!-- Summary Cards -->
        <section class="summary">

            <div class="summary-card">
                <p>Total Expenses</p>
                <h2 id="totalAmount">Rs. 0</h2>
            </div>

            <div class="summary-card">
                <p>Total Transactions</p>
                <h2 id="totalTransactions">0</h2>
            </div>

        </section>

        <!-- Add Expense Form -->
        <section class="expense-form">

            <h2>Add New Expense</h2>

            <form id="expenseForm">

                <div class="form-group">
                    <label for="expenseName">Expense Name</label>
                    <input
                        type="text"
                        id="expenseName"
                        placeholder="e.g. Grocery"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="expenseAmount">Amount (Rs.)</label>
                    <input
                        type="number"
                        id="expenseAmount"
                        placeholder="Enter amount"
                        min="1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="expenseCategory">Category</label>

                    <select id="expenseCategory" required>
                        <option value="">Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Transport">Transport</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <button type="submit" id="addBtn">
                    + Add Expense
                </button>

            </form>

        </section>

        <!-- Expense List -->
        <section class="expense-list">

            <div class="list-header">
                <h2>Recent Expenses</h2>
                <span id="expenseCount">0 Items</span>
            </div>

            <div id="expenseContainer">

                <p class="empty-message">
                    No expenses yet. Add your first expense!
                </p>

            </div>

        </section>

        <!-- Footer -->
        <footer>
            <p>Smart Expense Tracker © 2026</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
